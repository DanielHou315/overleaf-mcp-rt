# Overleaf CE versions the live matrix runs against: the newest patch release of
# each supported major, plus the oldest 6.x (6.0 changed the most under us).
#
# 3.x is not here because it does not work, and is not supported: its real-time
# service predates the join-on-connect handshake this client relies on (the matrix
# found that with 3.5.13 — the instance runs, the connection never completes).
#
# history-ot: whether the release has Overleaf's newer OT protocol; the suite then also runs
# against a project switched to it.
#
# version  overleaf image               mongo image  mongo shell  redis image  env file        history-ot
6.3.0      sharelatex/sharelatex:6.3.0  mongo:8.0    mongosh      redis:7.4    env.overleaf    yes
6.0.1      sharelatex/sharelatex:6.0.1  mongo:8.0    mongosh      redis:7.4    env.overleaf    yes
5.5.8      sharelatex/sharelatex:5.5.8  mongo:6.0    mongosh      redis:6.2    env.overleaf    no
4.2.9      sharelatex/sharelatex:4.2.9  mongo:5.0    mongosh      redis:6.2    env.sharelatex  no
